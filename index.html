<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>ShiftFit: 4-3 Recomp & Lifestyle OS</title>
    <meta name="description" content="Aesthetic body recomposition training & lifestyle tracker dynamically optimized for 12-hour 4-on/3-off shift workers." />
    
    <!-- iOS Safari PWA Meta Tags - OLED True Black -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShiftFit" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
    <link rel="apple-touch-icon" href="./icon-512.svg" />
    <link rel="manifest" href="./manifest.json" />

    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      body {
        background-color: #000000;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
      }
      /* Minimalist scrollbars */
      ::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border-radius: 2px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-kbp_O4io.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dcs4rves.css">
  </head>
  <body class="bg-black text-neutral-100 min-h-screen selection:bg-white selection:text-black">
    <div id="root"></div>
    <script>
      // Register service worker for offline PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
