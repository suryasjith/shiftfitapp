<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Outer subtle pulse ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.4" stroke-dasharray="16 10"/>
  
  <!-- Dynamic Shift 4-3 indicator arc -->
  <!-- 4 On segments (Amber) -->
  <path d="M 256,66 A 190,190 0 0,1 446,256" fill="none" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- 3 Off segments (Cyan) -->
  <path d="M 446,256 A 190,190 0 0,1 256,446" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Core Dumbbell / Lightning Bolt Icon -->
  <g transform="translate(136, 136) scale(0.47)">
    <!-- Dumbbell Bar -->
    <rect x="150" y="235" width="212" height="42" rx="12" fill="#e2e8f0"/>
    <rect x="220" y="240" width="72" height="32" rx="6" fill="#94a3b8"/>
    
    <!-- Left Weight Plates -->
    <rect x="80" y="140" width="40" height="232" rx="14" fill="url(#accent)"/>
    <rect x="125" y="170" width="22" height="172" rx="10" fill="#38bdf8"/>
    <rect x="40" y="185" width="36" height="142" rx="10" fill="#0284c7"/>
    
    <!-- Right Weight Plates -->
    <rect x="392" y="140" width="40" height="232" rx="14" fill="url(#accent)"/>
    <rect x="365" y="170" width="22" height="172" rx="10" fill="#38bdf8"/>
    <rect x="436" y="185" width="36" height="142" rx="10" fill="#0284c7"/>
    
    <!-- Lightning Bolt overlay in center -->
    <polygon points="275,130 220,260 265,260 235,382 305,250 260,250" fill="#fbbf24" stroke="#d97706" stroke-width="4" filter="url(#glow)"/>
  </g>
  
  <!-- Text Label Badge -->
  <rect x="176" y="380" width="160" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="256" y="404" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SHIFTFIT</text>
</svg>
