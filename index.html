    <meta name="description" content="Aesthetic body recomposition training & lifestyle tracker dynamically optimized for 12-hour 4-on/3-off shift workers." />
    
    <!-- iOS Safari PWA Meta Tags - Offwhite Warm Linen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShiftFit" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      body {
        background-color: #FBF9F5;
        color: #1C1917;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, h4, .font-heading {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;
        letter-spacing: -0.025em;
        color: #1C1917;
      }
      /* Minimalist iOS scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.12);
        border-radius: 9999px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-X5uruSca.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BnBWsZl8.css">

  <body class="bg-[#FBF9F5] text-stone-900 min-h-screen selection:bg-orange-200 selection:text-stone-900">
    <!-- Atmospheric Ambient Engine: Soft Warm Pastel Light Blobs for iOS Frosted Glass Depth -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
      <!-- Soft Warm Peach / Terracotta Glow (Top Left) -->
      <div 
        style="
          position: absolute;
          top: -8%;
          left: -12%;
          width: 460px;
          height: 460px;
          background: radial-gradient(circle, rgba(254, 215, 170, 0.55) 0%, rgba(254, 215, 170, 0.15) 50%, transparent 75%);
          filter: blur(80px);
          -webkit-filter: blur(80px);
          transform: translate3d(0, 0, 0);
        "
      ></div>

      <!-- Soft Serene Sage Green Glow (Right Center) -->
      <div 
        style="
          position: absolute;
          top: 32%;
          right: -15%;
          width: 480px;
          height: 480px;
          background: radial-gradient(circle, rgba(187, 247, 208, 0.45) 0%, rgba(187, 247, 208, 0.12) 50%, transparent 75%);
          filter: blur(80px);
          -webkit-filter: blur(80px);
          transform: translate3d(0, 0, 0);

      ></div>

      <!-- Soft Sky / Lavender Hydration Glow (Bottom Left) -->
      <div 
        style="
          position: absolute;
          bottom: -10%;
          left: 5%;
          width: 440px;
          height: 440px;
          background: radial-gradient(circle, rgba(224, 231, 255, 0.5) 0%, rgba(224, 231, 255, 0.15) 50%, transparent 75%);
          filter: blur(80px);
          -webkit-filter: blur(80px);
          transform: translate3d(0, 0, 0);
        "
      ></div>

    <div id="root"></div>
    <script>
      // Register service worker for offline PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
